name: Release

# Publishes a container image for this fork. Pushing a `v*` tag builds the image
# and pushes it to GHCR; the digest is printed in the job summary so deployments
# can pin `<tag>@sha256:<digest>`.
#
# The workflow can also be run manually against any ref to produce a test image
# tagged with the short commit SHA.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  # Signing backends compiled into the released binary
  FEATURES: softsign,yubihsm,ledger

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          # The validator hosts are x86_64; building other architectures would
          # only slow the release down
          platforms: linux/amd64
          build-args: FEATURES=${{ env.FEATURES }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          provenance: false

      - name: Verify the image runs and report the pin
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          version="$(docker run --rm "$image" version)"
          echo "reported version: ${version}"

          {
            echo "### tmkms image published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "- features: \`${FEATURES}\`"
            echo "- \`tmkms version\` reports: \`${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"
